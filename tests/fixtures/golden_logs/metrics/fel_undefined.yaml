# latency/fel_ms golden — undefined/None cases.
#   u_silent:  every emission (including the final) is empty — the model
#              never emits content -> FEL undefined -> null
#   u_ok:      first non-empty at t=4 -> (4+1)*40 = 200.0 ms
#   u_missing: in the reference but absent from the log -> null
# Aggregates over the single defined value: p50 = p90 = 200.0
# coverage = 1/3 = 0.3333333333333333
description: FEL undefined for a silent utterance and a missing one.
run_meta:
  schema_version: "1.0"
  run_id: "golden/fel-undefined"
  created_utc: "2026-08-14T09:31:07Z"
  git_sha: "a1b2c3d"
  config_hash: "9f2e77c1"
  experiment: "golden"
  dataset: { name: phoenix14t, split: test, fps: 25.0, unit: gloss }
  model:
    name: transformer_ctc
    params: 9200000
    mask: { mode: chunked, chunk_frames: 4, lookahead_frames: 4 }
  seed: 42
  hardware: { gpu: "synthetic" }
  wallclock_protocol: { batch_size: 1, warmup_utts: 0, timer: perf_counter }
events:
  - { type: utt_start, utt_id: u_silent, n_frames: 30 }
  - { type: emission, utt_id: u_silent, t_frame: 10, t_wall_ms: 1.0, hyp: [], is_final: false }
  - { type: emission, utt_id: u_silent, t_frame: 29, t_wall_ms: 1.0, hyp: [], is_final: true }
  - { type: utt_start, utt_id: u_ok, n_frames: 30 }
  - { type: emission, utt_id: u_ok, t_frame: 4, t_wall_ms: 1.0, hyp: [NORD], is_final: false }
  - { type: emission, utt_id: u_ok, t_frame: 29, t_wall_ms: 1.0, hyp: [NORD], is_final: true }
reference:
  unit: gloss
  utterances:
    u_silent: [STURM]
    u_ok: [NORD]
    u_missing: [KALT, WIND]
expect:
  metrics:
    latency/fel_ms:
      per_utt: { u_silent: null, u_ok: 200.0, u_missing: null }
      aggregate: { p50: 200.0, p90: 200.0, coverage: 0.3333333333333333 }
