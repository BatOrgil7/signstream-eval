# Stability goldens — class C on a character-unit (fingerspelling) run.
# On char-unit runs every sub/del is an intra-unit character edit: class C,
# default weight 1 (a class-B weighting would double this fixture's SWE).
#   u_c: partial [H,E,X]; final [H,E,L,L,O]
#     d(h0, final): H and E match; [X] -> [L,L,O] is 1 substitution + 2
#     inserts (minimal distance 3; inserts carry no severity class)
#     swe: 1 C-substitution -> 1/5 = 0.2
#     ne: 0 deletions -> 0.0
#     upgr: 1 changed / 3 partial tokens = 0.3333333333333333
#     upsr: [H,E,X] != final[:3]=[H,E,L] -> 1/1 = 1.0
description: Class-C severity weighting on a character-unit run.
run_meta:
  schema_version: "1.0"
  run_id: "golden/stability-char"
  created_utc: "2026-08-14T09:31:07Z"
  git_sha: "a1b2c3d"
  config_hash: "9f2e77c1"
  experiment: "golden"
  dataset: { name: fsboard, split: test, fps: 25.0, unit: char }
  model:
    name: transformer_ctc
    params: 9200000
    mask: { mode: chunked, chunk_frames: 4, lookahead_frames: 4 }
  seed: 42
  hardware: { gpu: "synthetic" }
  wallclock_protocol: { batch_size: 1, warmup_utts: 0, timer: perf_counter }
events:
  - { type: utt_start, utt_id: u_c, n_frames: 40 }
  - { type: emission, utt_id: u_c, t_frame: 19, t_wall_ms: 1.0, hyp: [H, E, X], is_final: false }
  - { type: emission, utt_id: u_c, t_frame: 39, t_wall_ms: 1.0, hyp: [H, E, L, L, O], is_final: true }
reference:
  unit: char
  utterances:
    u_c: [H, E, L, L, O]
expect:
  metrics:
    stability/swe:
      per_utt: { u_c: 0.2 }
      aggregate: { swe: 0.2, coverage: 1.0 }
    stability/ne:
      per_utt: { u_c: 0.0 }
      aggregate: { ne: 0.0, coverage: 1.0 }
    stability/upgr:
      per_utt: { u_c: 0.3333333333333333 }
      aggregate: { upgr: 0.3333333333333333, coverage: 1.0 }
    stability/upsr:
      per_utt: { u_c: 1.0 }
      aggregate: { upsr: 1.0, coverage: 1.0 }
