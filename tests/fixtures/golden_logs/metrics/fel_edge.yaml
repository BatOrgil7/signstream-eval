# latency/fel_ms golden — edge case: the only (and first) non-empty emission
# is the final one, at the last frame.
#   u_last: first non-empty at t=49 (T=50) -> (49+1)*40 = 2000.0 ms
#           (= the full utterance duration: maximal algorithmic FEL)
# A single defined value is every percentile of itself:
#   p50 = p90 = 2000.0 ; coverage 1.0
description: FEL when the first content arrives only with the final emission.
run_meta:
  schema_version: "1.0"
  run_id: "golden/fel-edge"
  created_utc: "2026-08-14T09:31:07Z"
  git_sha: "a1b2c3d"
  config_hash: "9f2e77c1"
  experiment: "golden"
  dataset: { name: phoenix14t, split: test, fps: 25.0, unit: gloss }
  model:
    name: transformer_ctc
    params: 9200000
    mask: { mode: bidirectional, chunk_frames: null, lookahead_frames: null }
  seed: 42
  hardware: { gpu: "synthetic" }
  wallclock_protocol: { batch_size: 1, warmup_utts: 0, timer: perf_counter }
events:
  - { type: utt_start, utt_id: u_last, n_frames: 50 }
  - { type: emission, utt_id: u_last, t_frame: 49, t_wall_ms: 1.0, hyp: [REGEN, WIND], is_final: true }
reference:
  unit: gloss
  utterances:
    u_last: [REGEN, WIND]
expect:
  metrics:
    latency/fel_ms:
      per_utt: { u_last: 2000.0 }
      aggregate: { p50: 2000.0, p90: 2000.0, coverage: 1.0 }
